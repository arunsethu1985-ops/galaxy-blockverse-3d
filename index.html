
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALAXY BLOCKVERSE 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="menu">
    <h1>🌌 GALAXY BLOCKVERSE</h1>
    <h2>3D Survival & Building</h2>
    <button id="playBtn">▶ PLAY GAME</button>
    <p>Explore • Mine • Build • Survive</p>
  </div>

  <div id="gameUI" hidden>
    <div id="topbar">
      <span>🌌 GALAXY BLOCKVERSE</span>
      <span id="coordinates">XYZ: 0, 0, 0</span>
    </div>

    <div id="crosshair">+</div>

    <div id="hotbar">
      <div class="slot selected" data-block="1">🟩<small>1</small></div>
      <div class="slot" data-block="2">🟫<small>2</small></div>
      <div class="slot" data-block="3">🪨<small>3</small></div>
      <div class="slot" data-block="4">🪵<small>4</small></div>
      <div class="slot" data-block="5">🍃<small>5</small></div>
      <div class="slot" data-block="6">🏖️<small>6</small></div>
    </div>

    <div id="controls">
      WASD: Move | Mouse: Look | Left Click: Mine |
      Right Click: Build | Space: Jump | 1–6: Blocks
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
